<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Unlock Split Lab</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg: #0c0f14;
        --panel: #131820;
        --line: #2a3546;
        --text: #e8edf4;
        --muted: #93a0b4;
        --amber: #f0b429;
        --teal: #3ecfb2;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; }
      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        background:
          radial-gradient(1200px 500px at 10% -10%, rgba(62, 207, 178, 0.12), transparent 50%),
          radial-gradient(900px 400px at 100% 0%, rgba(240, 180, 41, 0.1), transparent 45%),
          var(--bg);
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(420px, 100%);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 28px 26px 24px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      }
      .mark {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 18px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      .mark svg { display: block; }
      h1 {
        font-size: 1.55rem;
        line-height: 1.2;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
        line-height: 1.5;
      }
      label {
        display: block;
        font-size: 0.85rem;
        margin-bottom: 8px;
        color: var(--muted);
      }
      input {
        width: 100%;
        border: 1px solid var(--line);
        background: #0c0f14;
        color: var(--text);
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 1rem;
      }
      input:focus {
        outline: 2px solid var(--teal);
        outline-offset: 2px;
      }
      button {
        width: 100%;
        margin-top: 14px;
        border: 0;
        border-radius: 12px;
        padding: 12px 14px;
        font-weight: 700;
        font-size: 1rem;
        background: linear-gradient(180deg, #f6c656, var(--amber));
        color: #1a1404;
        cursor: pointer;
      }
      button:hover { filter: brightness(1.05); }
      button:focus-visible {
        outline: 2px solid var(--teal);
        outline-offset: 3px;
      }
      .error {
        min-height: 1.4em;
        margin: 12px 0 0;
        color: #ff8b96;
        font-size: 0.92rem;
      }
      .hint {
        margin-top: 18px;
        font-size: 0.8rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">
        <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="8" fill="#0c0f14"/>
          <path d="M7 8h8.5v16H7z" fill="#3ecfb2"/>
          <path d="M16.5 8H25v16h-8.5z" fill="#f0b429"/>
          <path d="M15.2 6v20" stroke="#e8edf4" stroke-width="1.6"/>
        </svg>
        Split Lab
      </div>
      <h1>Hold out the hype.</h1>
      <p>This classroom is password-gated. Enter the site password from your instructor or Netlify environment to play the data science games.</p>
      <form id="gate-form">
        <label for="password">Site password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <button type="submit">Unlock lab</button>
        <p class="error" id="error" role="status" aria-live="polite"></p>
      </form>
      <p class="hint">The password is stored as a Netlify environment variable named SITE_PASSWORD. It is never shipped in the frontend source.</p>
    </main>
    <script>
      (async () => {
        try {
          const res = await fetch("/api/auth", { credentials: "same-origin" });
          if (res.ok) location.replace("/");
        } catch {
          /* stay on gate */
        }
      })();

      document.getElementById("gate-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const error = document.getElementById("error");
        const password = document.getElementById("password").value;
        error.textContent = "";
        try {
          const res = await fetch("/api/auth", {
            method: "POST",
            credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password }),
          });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) {
            error.textContent = data.error || "Could not unlock. Check the password and that SITE_PASSWORD is configured.";
            return;
          }
          location.replace("/");
        } catch {
          error.textContent = "Network error. Try again.";
        }
      });
    </script>
  </body>
</html>
